<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Watermelon Icon -->
  <g transform="translate(4, 4)">
    <!-- Outer green rind -->
    <path d="M28 4 A24 24 0 0 1 52 28 L28 28 Z" fill="#005c2e"/>
    <path d="M28 4 A24 24 0 0 0 4 28 L28 28 Z" fill="#005c2e"/>
    <!-- White rind stripe -->
    <path d="M28 7 A21 21 0 0 1 49 28 L28 28 Z" fill="#f0f7f0"/>
    <path d="M28 7 A21 21 0 0 0 7 28 L28 28 Z" fill="#f0f7f0"/>
    <!-- Red flesh -->
    <path d="M28 10 A18 18 0 0 1 46 28 L28 28 Z" fill="#e01b33"/>
    <path d="M28 10 A18 18 0 0 0 10 28 L28 28 Z" fill="#e01b33"/>
    <!-- Seeds -->
    <ellipse cx="28" cy="18" rx="1.2" ry="1.6" fill="#111827"/>
    <ellipse cx="20" cy="22" rx="1" ry="1.4" fill="#111827" transform="rotate(-15 20 22)"/>
    <ellipse cx="36" cy="22" rx="1" ry="1.4" fill="#111827" transform="rotate(15 36 22)"/>
    <!-- Bottom rind base -->
    <rect x="4" y="28" width="48" height="5" rx="2.5" fill="#005c2e"/>
  </g>

  <!-- Brand Text -->
  <text x="64" y="33" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#111827" letter-spacing="-0.5">
    Free<tspan fill="#005c2e">Falastin</tspan>
  </text>
  
  <!-- Badge: SHOP -->
  <rect x="202" y="16" width="58" height="20" rx="4" fill="#005c2e" />
  <text x="231" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">
    SHOP
  </text>

  <!-- Tagline -->
  <text x="65" y="47" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#6b7280" letter-spacing="0.2">
    shop.freefalastin.de
  </text>
</svg>
